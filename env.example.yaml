# the credentials for HS-Admin API in the Format Username:Password
pacs:
  xyz00: myPacPassword
  xyz01: myOtherPassword

# the definition of the API Key and the list which PACs are allowed with which API Key
api:
  - key: superdupersecretapikeyforanoterapplicationheaderPlsChange
    pacs: [xyz00, xyz01]
  - key: anoutherkeyforanotherapp
    pacs: xyz00

server:
  host: 127.0.0.1
  port: 8000
  # Log level for both access logs and application logs.
  # critical
  # error   — XML-RPC faults and unexpected exceptions only
  # warning — + unknown API keys
  # info    — + every XML-RPC call with PAC name (recommended for production)
  # debug   — + call duration in ms
  log-level: info
  worker: 4